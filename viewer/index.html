<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pr-timeline</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="topbar">
    <button class="bar-btn" id="tb-rail" title="toggle sidebar (t)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="1.7" y="2.7" width="12.6" height="10.6" rx="2"/>
        <line x1="6.2" y1="2.7" x2="6.2" y2="13.3"/>
      </svg>
      sidebar
    </button>
    <button class="bar-btn" id="tb-fold" title="fold unchanged code (x)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5,2.2 8,5.2 11,2.2"/>
        <line x1="4" y1="8" x2="12" y2="8"/>
        <polyline points="5,13.8 8,10.8 11,13.8"/>
      </svg>
      fold
    </button>
    <span class="spacer"></span>
    <span id="topbar-branch" class="mono dim"></span>
    <button class="bar-btn" id="tb-keys" title="keyboard shortcuts (?)">⌘</button>
  </div>

  <main id="main">
    <nav id="rail" class="hidden"></nav>
    <div id="editor-wrap">
      <div id="editor"></div>
      <div id="placeholder" hidden></div>
    </div>
  </main>

  <div id="topcard">
    <header id="header">
      <div id="card-dots">
        <button class="dot dot-min" title="minimize card (m)"></button>
        <button class="dot dot-corner" title="move card to next corner (c)"></button>
      </div>
      <span id="position" class="mono"></span>
      <h1 id="subject"></h1>
    </header>
    <div id="commit-body" hidden></div>
  </div>

  <div id="timeline-pill">
    <button id="btn-prev" class="nav-btn" title="previous change (←)">‹</button>
    <div id="scrubber" aria-label="commit timeline"></div>
    <button id="btn-next" class="nav-btn" title="next change (→)">›</button>
  </div>

  <footer id="status">
    <span id="file-label" class="mono"></span>
    <span id="change-label" class="mono dim"></span>
    <span class="spacer"></span>
    <span class="hint dim">←→ step · ⇧←→ commit · ? keys</span>
  </footer>

  <div id="help" hidden>
    <div id="help-card">
      <h2>keys</h2>
      <dl>
        <dt>→ / j</dt><dd>next change</dd>
        <dt>← / k</dt><dd>previous change</dd>
        <dt>⇧→ / J</dt><dd>next commit</dd>
        <dt>⇧← / K</dt><dd>previous commit</dd>
        <dt>g / G</dt><dd>first / last commit</dd>
        <dt>m</dt><dd>minimize / restore commit card</dd>
        <dt>c</dt><dd>move card to next corner</dd>
        <dt>t</dt><dd>toggle sidebar</dd>
        <dt>x</dt><dd>fold unchanged code</dd>
        <dt>?</dt><dd>this help</dd>
      </dl>
    </div>
  </div>

<script src="/vs/loader.js"></script>
<script src="/app.js"></script>
</body>
</html>
